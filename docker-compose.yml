version: "3.9"

networks:
  arteci-net:
    driver: bridge

volumes:
  minio-data:
    driver: local

services:

  arteci-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: arteci-api
    restart: unless-stopped
    ports:
      - "9001:8000"
    environment:
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_SECURE: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "arteci-api"
      WORKERS: "2"
      PORT: "8000"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - arteci-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: arteci-minio
    restart: unless-stopped
    ports:
      - "9100:9000"
      - "9101:9101"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data --console-address ":9101"
    networks:
      - arteci-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    container_name: arteci-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - arteci-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin --quiet;
        mc mb --ignore-existing local/raw;
        mc mb --ignore-existing local/processed;
        echo 'Buckets crees : raw, processed';
      "

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: arteci-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - arteci-net
