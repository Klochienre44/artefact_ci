# ─────────────────────────────────────────────────────────────────────────────
# ARTECI — ConfigMap (configuration non sensible)
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: arteci-config
  namespace: arteci-production
data:
  MINIO_ENDPOINT: "minio-svc:9000"
  MINIO_SECURE: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-svc:4317"
  OTEL_SERVICE_NAME: "arteci-api"
  WORKERS: "4"
  CHUNK_SIZE: "100000"
  PREVIEW_ROWS: "100"

---
# ─────────────────────────────────────────────────────────────────────────────
# ARTECI — Secret (credentials MinIO)
# IMPORTANT : En production, utiliser Vault ou Sealed Secrets
#             Les valeurs ci-dessous sont des EXEMPLES en base64
#             echo -n "votre_valeur" | base64
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: arteci-secrets
  namespace: arteci-production
type: Opaque
data:
  # Remplacer par vos vraies valeurs encodées en base64
  # echo -n "minioadmin" | base64  →  bWluaW9hZG1pbg==
  minio-access-key: bWluaW9hZG1pbg==
  minio-secret-key: bWluaW9hZG1pbg==

---
# ─────────────────────────────────────────────────────────────────────────────
# ARTECI — Namespace
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Namespace
metadata:
  name: arteci-production
  labels:
    project: arteci
    env: production

---
# ─────────────────────────────────────────────────────────────────────────────
# ARTECI — ServiceAccount (moindre privilège)
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount
metadata:
  name: arteci-sa
  namespace: arteci-production
  labels:
    app: arteci-api
automountServiceAccountToken: false
