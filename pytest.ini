[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Tests unitaires (rapides, sans dépendances externes)
    integration: Tests d'intégration (avec mocks ou services réels)
